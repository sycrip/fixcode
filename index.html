<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixCode - Main Dashboard</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #238636;
      --accent-red: #da3633;
      --accent-orange: #d29922;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #fff;
    }

    .repo-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .repo-info span {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .pat-container {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    input[type="password"],
    textarea {
      background-color: #010409;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    input[type="password"]:focus,
    textarea:focus {
      outline: 1px solid var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .btn {
      background-color: var(--border-color);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #000;
    }

    .btn-danger {
      background-color: var(--accent-red);
    }

    .btn-warning {
      background-color: var(--accent-orange);
      color: #000;
    }

    .btn-success {
      background-color: var(--accent-green);
    }

    .code-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .code-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.25rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .file-path {
      font-family: monospace;
      font-size: 1rem;
      color: var(--accent-blue);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    pre {
      background-color: #010409;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
    }

    .editor-container {
      margin-top: 1rem;
      display: none;
    }

    textarea.code-editor {
      width: 100%;
      height: 150px;
      font-family: monospace;
      margin-bottom: 0.5rem;
    }

    .diff-container {
      margin-top: 1rem;
      padding: 1rem;
      background-color: #010409;
      border: 1px dashed var(--accent-orange);
      border-radius: 6px;
      display: none;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }

    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      display: none;
    }

    .status-msg.error {
      background-color: rgba(218, 54, 51, 0.2);
      border: 1px solid var(--accent-red);
      color: #ff7b72;
    }

    .status-msg.success {
      background-color: rgba(35, 134, 54, 0.2);
      border: 1px solid var(--accent-green);
      color: #7ee787;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>FixCode Management Console</h1>
        <div class="repo-info">
          Repository: <span id="repo-display"></span> | Branch: <span id="branch-display"></span>
        </div>
      </div>
      
      <div class="pat-container">
        <input type="password" id="pat-input" placeholder="Enter GitHub PAT..." />
        <button class="btn btn-primary" onclick="loadRepositoryContent()">Load Files</button>
      </div>
    </header>

    <div id="status-box" class="status-msg"></div>

    <main>
      <div id="code-list" class="code-list">
        <!-- Code items will render here dynamically -->
      </div>
    </main>
  </div>

  <script>
    // GitHub Repository Configuration
    const GITHUB_CONFIG = {
      username: "sycrip",
      repo: "fixcode",
      branch: "main"
    };

    // Store original content to compute changes/diffs
    const originalContentMap = {};

    // Initialize UI on load
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("repo-display").textContent = `${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}`;
      document.getElementById("branch-display").textContent = GITHUB_CONFIG.branch;
      
      // Initial render with placeholder data
      renderCodeList([
        { path: "src/index.js", sha: "mock1", content: 'console.log("Hello, FixCode!");' },
        { path: "src/utils.js", sha: "mock2", content: 'function add(a, b) {\n  return a + b;\n}' }
      ]);
    });

    function getPAT() {
      return document.getElementById("pat-input").value.trim();
    }

    function showStatus(message, isError = false) {
      const statusBox = document.getElementById("status-box");
      statusBox.textContent = message;
      statusBox.className = `status-msg ${isError ? 'error' : 'success'}`;
      statusBox.style.display = "block";
      setTimeout(() => { statusBox.style.display = "none"; }, 5000);
    }

    // Fetch files from GitHub REST API
    async function loadRepositoryContent() {
      const pat = getPAT();
      if (!pat) {
        showStatus("Please enter your Personal Access Token (PAT) first.", true);
        return;
      }

      const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents?ref=${GITHUB_CONFIG.branch}`;

      try {
        const response = await fetch(url, {
          headers: {
            "Authorization": `token ${pat}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (!response.ok) throw new Error(`GitHub API Error: ${response.statusText}`);

        const data = await response.json();
        const fileItems = [];

        // Fetch detailed content for code files
        for (const item of data) {
          if (item.type === "file") {
            const fileRes = await fetch(item.url, {
              headers: { "Authorization": `token ${pat}` }
            });
            const fileData = await fileRes.json();
            const decodedContent = atob(fileData.content.replace(/\n/g, ''));
            
            fileItems.push({
              path: item.path,
              sha: item.sha,
              content: decodedContent
            });
          }
        }

        renderCodeList(fileItems);
        showStatus("Repository content loaded successfully.");
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    // Render code cards into the DOM
    function renderCodeList(files) {
      const container = document.getElementById("code-list");
      container.innerHTML = "";

      files.forEach((file, index) => {
        originalContentMap[file.path] = file.content;

        const card = document.createElement("div");
        card.className = "code-card";
        card.id = `card-${index}`;

        card.innerHTML = `
          <div class="card-header">
            <span class="file-path">${file.path}</span>
            <div class="actions">
              <button class="btn btn-danger" onclick="deleteCode('${file.path}', '${file.sha}')">Delete</button>
              <button class="btn btn-warning" onclick="toggleEdit('${index}')">Edit</button>
              <button class="btn btn-primary" onclick="reviewChange('${index}', '${file.path}')">Review Change</button>
            </div>
          </div>
          
          <pre id="view-${index}">${escapeHTML(file.content)}</pre>

          <div id="editor-container-${index}" class="editor-container">
            <textarea id="editor-${index}" class="code-editor">${file.content}</textarea>
            <button class="btn btn-success" onclick="saveEdit('${file.path}', '${file.sha}', '${index}')">Save to GitHub</button>
          </div>

          <div id="diff-${index}" class="diff-container"></div>
        `;

        container.appendChild(card);
      });
    }

    // 1. Action: Delete
    async function deleteCode(path, sha) {
      if (!confirm(`Are you sure you want to delete ${path}?`)) return;

      const pat = getPAT();
      if (!pat) {
        showStatus("PAT required to delete file.", true);
        return;
      }

      const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${path}`;

      try {
        const response = await fetch(url, {
          method: "DELETE",
          headers: {
            "Authorization": `token ${pat}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Delete ${path} via FixCode App`,
            sha: sha,
            branch: GITHUB_CONFIG.branch
          })
        });

        if (!response.ok) throw new Error("Failed to delete file.");

        showStatus(`Deleted ${path} successfully.`);
        loadRepositoryContent(); // Reload UI
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    // 2. Action: Edit Toggle & Save
    function toggleEdit(index) {
      const editor = document.getElementById(`editor-container-${index}`);
      const view = document.getElementById(`view-${index}`);
      const isEditing = editor.style.display === "block";

      editor.style.display = isEditing ? "none" : "block";
      view.style.display = isEditing ? "block" : "none";
    }

    async function saveEdit(path, sha, index) {
      const pat = getPAT();
      if (!pat) {
        showStatus("PAT required to save changes.", true);
        return;
      }

      const newContent = document.getElementById(`editor-${index}`).value;
      const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${path}`;

      try {
        const response = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `token ${pat}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Update ${path} via FixCode App`,
            content: btoa(newContent),
            sha: sha,
            branch: GITHUB_CONFIG.branch
          })
        });

        if (!response.ok) throw new Error("Failed to update file.");

        showStatus(`Saved changes for ${path}.`);
        loadRepositoryContent();
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    // 3. Action: Review Change
    function reviewChange(index, path) {
      const diffBox = document.getElementById(`diff-${index}`);
      const currentContent = document.getElementById(`editor-${index}`) 
        ? document.getElementById(`editor-${index}`).value 
        : originalContentMap[path];
      
      const original = originalContentMap[path] || "";

      if (diffBox.style.display === "block") {
        diffBox.style.display = "none";
        return;
      }

      if (original === currentContent) {
        diffBox.innerHTML = "<em>No changes detected from original file.</em>";
      } else {
        diffBox.innerHTML = `<strong>Changes comparison:</strong>\n\n` +
          `<span style="color: var(--accent-red);">- Original (${original.length} chars)</span>\n` +
          `<span style="color: var(--accent-green);">+ Modified (${currentContent.length} chars)</span>`;
      }

      diffBox.style.display = "block";
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
