<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code C++ Code Review Platform</title>
  <style>
    :root {
      --bg-dark: #1e1e1e;
      --bg-sidebar: #252526;
      --bg-card: #2d2d2d;
      --border-color: #3c3c3c;
      --text-main: #d4d4d4;
      --text-muted: #858585;
      --accent-blue: #0e639c;
      --accent-blue-hover: #1177bb;
      --diff-del-bg: #4b1818;
      --diff-del-text: #f85149;
      --diff-add-bg: #143d23;
      --diff-add-text: #7ee787;
      --badge-done: #238636;
      --badge-pending: #9e6a03;
      --badge-read: #388bfd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; min-height: 100vh; }

    .hidden { display: none !important; }

    /* Login Modal */
    #loginOverlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      padding: 32px; border-radius: 8px; width: 100%; max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .login-card h2 { margin-bottom: 20px; font-size: 1.4rem; text-align: center; color: #ffffff; }

    /* Header */
    header {
      background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
    }
    .user-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.75rem; font-weight: bold; background: var(--accent-blue); color: white;
    }

    /* Common UI Components */
    .container { max-width: 1400px; margin: 20px auto; padding: 0 16px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
    input[type="text"], input[type="password"], textarea {
      width: 100%; background: #1e1e1e; border: 1px solid var(--border-color);
      color: var(--text-main); padding: 8px 12px; border-radius: 4px; font-size: 0.9rem;
    }
    input:focus, textarea:focus { outline: 1px solid var(--accent-blue); }

    .btn {
      background: var(--accent-blue); color: white; border: none; padding: 8px 16px;
      border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: var(--accent-blue-hover); }
    .btn-secondary { background: #3a3d41; }
    .btn-secondary:hover { background: #45494e; }
    .btn-success { background: #238636; }
    .btn-success:hover { background: #2ea043; }

    /* Badges */
    .status-tag { padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; font-weight: 600; margin-left: 6px; }
    .tag-marked { background: var(--badge-done); color: white; }
    .tag-pending { background: var(--badge-pending); color: white; }
    .tag-read { background: var(--badge-read); color: white; }

    /* File List Table */
    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border-bottom: 1px solid var(--border-color); background: var(--bg-sidebar);
      margin-bottom: 8px; border-radius: 4px;
    }
    .file-meta { display: flex; align-items: center; gap: 10px; }
    .file-tag-pill { background: #333333; color: #9cdcfe; border: 1px solid #454545; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }

    /* Editor Layout (Side-by-Side VS Code Style) */
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .editor-pane { background: #1e1e1e; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; }
    .pane-header { background: #252526; padding: 8px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.8rem; font-weight: bold; color: var(--text-muted); }

    .code-container {
      font-family: 'Consolas', 'Courier New', monospace; font-size: 13px;
      line-height: 1.4; padding: 12px; min-height: 450px; max-height: 600px;
      overflow: auto; white-space: pre; tab-size: 4;
    }

    textarea.code-editor {
      width: 100%; height: 450px; background: #1e1e1e; color: #d4d4d4;
      border: none; resize: vertical; outline: none;
      font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.4;
      padding: 12px; tab-size: 4;
    }

    /* Diff Highlight Classes */
    .diff-del {
      background-color: var(--diff-del-bg); color: var(--diff-del-text);
      text-decoration: line-through; display: block; width: 100%;
    }
    .diff-add {
      background-color: var(--diff-add-bg); color: var(--diff-add-text);
      text-decoration: underline; display: block; width: 100%;
    }
    .diff-equal { display: block; width: 100%; color: var(--text-main); }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay">
    <div class="login-card">
      <h2>VS Code Review Sign In</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" placeholder="qwertyPi / WongChun1234 / firewater" required>
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="Password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Login</button>
        <div id="loginErrorMsg" style="color: #f85149; font-size: 0.8rem; margin-top: 10px; text-align: center;" class="hidden">Invalid credentials</div>
      </form>
    </div>
  </div>

  <!-- MAIN APPLICATION -->
  <div id="appContent" class="hidden">
    <header>
      <div>
        <strong id="currentUserSpan" style="color: #ffffff;">-</strong>
        <span id="userRoleBadge" class="user-badge">-</span>
      </div>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </header>

    <main class="container">
      <!-- DASHBOARD / MENU VIEW -->
      <div id="menuView">
        <!-- Upload Card (ONLY Visible for firewater) -->
        <div id="uploadSection" class="card hidden">
          <h3 style="margin-bottom: 12px; color: #ffffff;">Upload C++ File or Source Code</h3>
          <form id="uploadForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="form-group">
                <label>Code Name / Title</label>
                <input type="text" id="codeNameInput" placeholder="e.g. Solution.cpp" required>
              </div>
              <div class="form-group">
                <label>Tag / Category</label>
                <input type="text" id="codeTagInput" placeholder="e.g. Homework 1" required>
              </div>
            </div>
            
            <div class="form-group">
              <label>Select C++ File OR Input Text Directly</label>
              <input type="file" id="fileInput" accept=".cpp,.h,.hpp,.c,.txt" style="margin-bottom: 8px;">
              <textarea id="rawCodeInput" placeholder="// Paste C++ code here if not uploading a file..."></textarea>
            </div>
            <button type="submit" class="btn btn-success">Upload Code</button>
          </form>
        </div>

        <!-- File List Menu -->
        <div class="card">
          <h3 style="margin-bottom: 16px; color: #ffffff;">Code Review Files</h3>
          <div id="fileListContainer">
            <!-- Dynamic Files Loaded Here -->
          </div>
        </div>
      </div>

      <!-- EDITOR / FIX VIEW -->
      <div id="editorView" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <button class="btn btn-secondary" onclick="showMenu()">&larr; Back to Menu</button>
          <div id="editorActions" style="display: flex; gap: 10px;">
            <button class="btn btn-success" onclick="saveEdits()">Save Edits</button>
            <button id="markDoneBtn" class="btn hidden" style="background: #8957e5;" onclick="markAsDone()">Mark as Done</button>
            <button id="markReadBtn" class="btn btn-secondary hidden" onclick="markAsRead()">Mark as Read</button>
          </div>
        </div>

        <div class="card" style="padding: 12px 20px; margin-bottom: 12px;">
          <h2 id="activeFileTitle" style="color: #ffffff;">-</h2>
          <span id="activeFileTag" class="file-tag-pill">-</span>
        </div>

        <!-- Side-by-Side Comparison -->
        <div class="editor-grid">
          <!-- Left: Original Code with Deletion Highlights -->
          <div class="editor-pane">
            <div class="pane-header">ORIGINAL CODE (Deletions Highlighted)</div>
            <div id="leftDiffView" class="code-container"></div>
          </div>

          <!-- Right: Modified Code Editor & Highlight Preview -->
          <div class="editor-pane">
            <div class="pane-header">MODIFIED CODE (Edit below & highlights additions)</div>
            <textarea id="rightCodeEditor" class="code-editor" spellcheck="false"></textarea>
            <div class="pane-header" style="border-top: 1px solid var(--border-color);">LIVE DIFF HIGHLIGHT PREVIEW (Additions)</div>
            <div id="rightDiffView" class="code-container" style="min-height: 150px; max-height: 200px;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // SHA-256 Hash of "password123456"
    const EXPECTED_PASSWORD_HASH = 'e2c2f211320399d2127161b953460f785b8393527b409c25f541e21e78076632';

    const ACCOUNTS = {
      'qwertypi': { name: 'qwertyPi', role: 'Marker', canMark: true, canUpload: false, canRead: false },
      'wongchun1234': { name: 'WongChun1234', role: 'Marker', canMark: true, canUpload: false, canRead: false },
      'firewater': { name: 'firewater', role: 'Viewer/Uploader', canMark: false, canUpload: true, canRead: true }
    };

    let currentUser = null;
    let activeFileId = null;

    // Pure JavaScript Standalone SHA-256 (Guarantees offline & file:// protocol compatibility)
    function sha256Sync(ascii) {
      function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
      const mathPow = Math.pow, maxWord = mathPow(2, 32);
      let i, j, result = '';
      const words = [], asciiBitLength = ascii.length * 8;
      const hash = [], k = [];
      let primeCounter = 0, isComposite = {};

      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 300; i += candidate) isComposite[i] = candidate;
          if (primeCounter < 8) hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
          primeCounter++;
        }
      }

      ascii += '\x80';
      while ((ascii.length % 64) !== 56) ascii += '\x00';
      for (i = 0; i < ascii.length; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return '';
        words[i >> 2] |= j << ((3 - i % 4) * 8);
      }
      words[words.length] = Math.floor(asciiBitLength / maxWord);
      words[words.length] = asciiBitLength;

      for (j = 0; j < words.length;) {
        const w = words.slice(j, j += 16);
        const oldHash = hash.slice(0);

        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
          const temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ (~e & hash[6])) + k[i]
            + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));

          hash[7] = hash[6]; hash[6] = hash[5]; hash[5] = hash[4];
          hash[4] = (hash[3] + temp1) | 0;
          hash[3] = hash[2]; hash[2] = hash[1]; hash[1] = hash[0];
          hash[0] = (temp1 + temp2) | 0;
        }
        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }

      for (i = 0; i < 8; i++) {
        for (j = 3; j >= 0; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    // Login Form Handler
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const uInput = document.getElementById('usernameInput').value.trim().toLowerCase();
      const pInput = document.getElementById('passwordInput').value.trim();
      const errDiv = document.getElementById('loginErrorMsg');

      const account = ACCOUNTS[uInput];
      const hashedPass = sha256Sync(pInput);

      if (account && hashedPass === EXPECTED_PASSWORD_HASH) {
        currentUser = account;
        document.getElementById('currentUserSpan').innerText = currentUser.name;
        document.getElementById('userRoleBadge').innerText = currentUser.role;

        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('appContent').classList.remove('hidden');

        // Toggle Upload Section based on user role
        if (currentUser.canUpload) {
          document.getElementById('uploadSection').classList.remove('hidden');
        } else {
          document.getElementById('uploadSection').classList.add('hidden');
        }

        // Always stay on Menu page after login
        showMenu();
        return;
      }
      errDiv.classList.remove('hidden');
    });

    function logout() {
      currentUser = null;
      document.getElementById('loginForm').reset();
      document.getElementById('loginErrorMsg').classList.add('hidden');
      document.getElementById('loginOverlay').classList.remove('hidden');
      document.getElementById('appContent').classList.add('hidden');
    }

    function showMenu() {
      document.getElementById('menuView').classList.remove('hidden');
      document.getElementById('editorView').classList.add('hidden');
      renderFileList();
    }

    // Storage Helpers with Default Sample File
    function getStoredFiles() {
      const stored = localStorage.getItem('cpp_project_files');
      if (!stored) {
        const sampleFiles = [{
          id: 101,
          name: 'BinarySearch.cpp',
          tag: 'Algorithms',
          originalCode: '#include <iostream>\nusing namespace std;\n\nint binarySearch(int arr[], int l, int r, int x) {\n    while (l <= r) {\n        int m = l + (r - l) / 2;\n        if (arr[m] == x) return m;\n        if (arr[m] < x) l = m + 1;\n        else r = m - 1;\n    }\n    return -1;\n}',
          modifiedCode: '#include <iostream>\nusing namespace std;\n\nint binarySearch(int arr[], int l, int r, int x) {\n    while (l <= r) {\n        int m = l + (r - l) / 2;\n        if (arr[m] == x) return m;\n        if (arr[m] < x) l = m + 1;\n        else r = m - 1;\n    }\n    return -1;\n}',
          isMarked: false,
          isRead: false
        }];
        localStorage.setItem('cpp_project_files', JSON.stringify(sampleFiles));
        return sampleFiles;
      }
      return JSON.parse(stored);
    }

    function saveStoredFiles(files) {
      localStorage.setItem('cpp_project_files', JSON.stringify(files));
    }

    // File Upload Handling (firewater only)
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('rawCodeInput').value = evt.target.result;
        };
        reader.readAsText(file);
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!currentUser.canUpload) return;

      const name = document.getElementById('codeNameInput').value.trim();
      const tag = document.getElementById('codeTagInput').value.trim();
      const code = document.getElementById('rawCodeInput').value;

      if (!code) {
        alert('Please select a C++ file or paste code in the text box.');
        return;
      }

      const files = getStoredFiles();
      const newFile = {
        id: Date.now(),
        name,
        tag,
        originalCode: code,
        modifiedCode: code,
        isMarked: false,
        isRead: false
      };

      files.push(newFile);
      saveStoredFiles(files);

      this.reset();
      renderFileList();
    });

    // File List Rendering with Account-Specific Sorting
    function renderFileList() {
      const files = getStoredFiles();
      const container = document.getElementById('fileListContainer');

      if (files.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">No files uploaded yet.</p>';
        return;
      }

      // Sorting rules according to role
      files.sort((a, b) => {
        if (currentUser.role === 'Marker') {
          // qwertyPi & WongChun1234: Unmarked on top, Marked on bottom
          return (a.isMarked === b.isMarked) ? 0 : a.isMarked ? 1 : -1;
        } else {
          // firewater: 1. Marked & Unread, 2. Not marked, 3. Read
          const getPriority = (f) => {
            if (f.isMarked && !f.isRead) return 1;
            if (!f.isMarked) return 2;
            return 3;
          };
          return getPriority(a) - getPriority(b);
        }
      });

      container.innerHTML = files.map(f => {
        let statusBadges = '';
        if (f.isMarked) statusBadges += '<span class="status-tag tag-marked">Marked as Done</span>';
        else statusBadges += '<span class="status-tag tag-pending">Pending</span>';
        if (f.isRead) statusBadges += '<span class="status-tag tag-read">Read</span>';

        return `
          <div class="file-item">
            <div class="file-meta">
              <strong style="color: #ffffff;">${escapeHtml(f.name)}</strong>
              <span class="file-tag-pill">${escapeHtml(f.tag)}</span>
              ${statusBadges}
            </div>
            <button class="btn btn-secondary" onclick="openFileEditor(${f.id})">Open & Edit</button>
          </div>
        `;
      }).join('');
    }

    // Open File Editor
    function openFileEditor(id) {
      const files = getStoredFiles();
      const file = files.find(f => f.id === id);
      if (!file) return;

      activeFileId = id;
      document.getElementById('activeFileTitle').innerText = file.name;
      document.getElementById('activeFileTag').innerText = file.tag;
      
      const editor = document.getElementById('rightCodeEditor');
      editor.value = file.modifiedCode || file.originalCode;

      // Configure Action Buttons
      const markDoneBtn = document.getElementById('markDoneBtn');
      const markReadBtn = document.getElementById('markReadBtn');

      if (currentUser.canMark) markDoneBtn.classList.remove('hidden');
      else markDoneBtn.classList.add('hidden');

      if (currentUser.canRead) markReadBtn.classList.remove('hidden');
      else markReadBtn.classList.add('hidden');

      document.getElementById('menuView').classList.add('hidden');
      document.getElementById('editorView').classList.remove('hidden');

      updateDiffViews();
    }

    // Line-Level LCS Algorithm (Fixes inserted row shift issue)
    function computeLineLCS(origText, modText) {
      const origLines = origText.split('\n');
      const modLines = modText.split('\n');
      const n = origLines.length;
      const m = modLines.length;

      const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));

      for (let i = 0; i < n; i++) {
        for (let j = 0; j < m; j++) {
          if (origLines[i] === modLines[j]) {
            dp[i + 1][j + 1] = dp[i][j] + 1;
          } else {
            dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
      }

      let i = n, j = m;
      const diff = [];
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && origLines[i - 1] === modLines[j - 1]) {
          diff.push({ type: 'equal', value: origLines[i - 1] });
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          diff.push({ type: 'add', value: modLines[j - 1] });
          j--;
        } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
          diff.push({ type: 'delete', value: origLines[i - 1] });
          i--;
        }
      }
      return diff.reverse();
    }

    function updateDiffViews() {
      const files = getStoredFiles();
      const file = files.find(f => f.id === activeFileId);
      if (!file) return;

      const origText = file.originalCode;
      const modText = document.getElementById('rightCodeEditor').value;

      const diff = computeLineLCS(origText, modText);

      let leftHTML = '';
      let rightHTML = '';

      diff.forEach(chunk => {
        const safeVal = escapeHtml(chunk.value) || '&nbsp;';
        if (chunk.type === 'equal') {
          leftHTML += `<span class="diff-equal">${safeVal}</span>`;
          rightHTML += `<span class="diff-equal">${safeVal}</span>`;
        } else if (chunk.type === 'delete') {
          leftHTML += `<span class="diff-del">${safeVal}</span>`;
        } else if (chunk.type === 'add') {
          rightHTML += `<span class="diff-add">${safeVal}</span>`;
        }
      });

      document.getElementById('leftDiffView').innerHTML = leftHTML;
      document.getElementById('rightDiffView').innerHTML = rightHTML;
    }

    // Auto Bracket Completion & Shift/Tab Handling
    const editorEl = document.getElementById('rightCodeEditor');

    editorEl.addEventListener('input', updateDiffViews);

    editorEl.addEventListener('keydown', function(e) {
      const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };

      // 1. Auto Bracket/Quote Completion
      if (pairs[e.key]) {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        const val = this.value;

        this.value = val.substring(0, start) + e.key + pairs[e.key] + val.substring(end);
        this.selectionStart = this.selectionEnd = start + 1;
        updateDiffViews();
        return;
      }

      // 2. Tab key = 4 spaces
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;

        this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
        updateDiffViews();
        return;
      }

      // 3. Keep Indentation Shift on Enter
      if (e.key === 'Enter') {
        e.preventDefault();
        const start = this.selectionStart;
        const val = this.value;

        const lastNewLine = val.lastIndexOf('\n', start - 1);
        const currentLine = val.substring(lastNewLine + 1, start);
        const match = currentLine.match(/^\s*/);
        let indent = match ? match[0] : '';

        if (currentLine.trim().endsWith('{')) {
          indent += '    ';
        }

        this.value = val.substring(0, start) + '\n' + indent + val.substring(start);
        this.selectionStart = this.selectionEnd = start + 1 + indent.length;
        updateDiffViews();
      }
    });

    // Save Edits (Does NOT overwrite originalCode)
    function saveEdits() {
      const files = getStoredFiles();
      const file = files.find(f => f.id === activeFileId);
      if (file) {
        file.modifiedCode = document.getElementById('rightCodeEditor').value;
        saveStoredFiles(files);
        alert('Edits saved successfully!');
      }
    }

    // Mark as Done (qwertyPi & WongChun1234 only)
    function markAsDone() {
      if (!currentUser.canMark) return;
      const files = getStoredFiles();
      const file = files.find(f => f.id === activeFileId);
      if (file) {
        file.isMarked = true;
        saveStoredFiles(files);
        alert('File marked as done!');
        showMenu();
      }
    }

    // Mark as Read (firewater only)
    function markAsRead() {
      if (!currentUser.canRead) return;
      const files = getStoredFiles();
      const file = files.find(f => f.id === activeFileId);
      if (file) {
        file.isRead = true;
        saveStoredFiles(files);
        alert('File marked as read!');
        showMenu();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
