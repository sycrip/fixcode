<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixCode - Main Dashboard</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #238636;
      --accent-red: #da3633;
      --accent-orange: #d29922;
      --diff-add-bg: rgba(46, 160, 67, 0.15);
      --diff-add-text: #7ee787;
      --diff-remove-bg: rgba(248, 81, 73, 0.15);
      --diff-remove-text: #ff7b72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      color: #fff;
    }

    .repo-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .repo-info span {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .pat-container {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    input[type="password"],
    textarea {
      background-color: #010409;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    input[type="password"]:focus,
    textarea:focus {
      outline: 1px solid var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .btn {
      background-color: var(--border-color);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-primary { background-color: var(--accent-blue); color: #000; }
    .btn-danger { background-color: var(--accent-red); color: #fff; }
    .btn-warning { background-color: var(--accent-orange); color: #000; }
    .btn-success { background-color: var(--accent-green); color: #fff; }

    .code-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .code-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.25rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .file-path {
      font-family: monospace;
      font-size: 1rem;
      color: var(--accent-blue);
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    pre.code-view {
      background-color: #010409;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      max-height: 300px;
    }

    /* Combined Editor & Reviewer Workspace */
    .combined-workspace {
      margin-top: 1rem;
      display: none;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    .workspace-panel {
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    textarea.code-editor {
      width: 100%;
      height: 250px;
      font-family: monospace;
      resize: vertical;
      line-height: 1.4;
    }

    .diff-viewer {
      background-color: #010409;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.5rem 0;
      height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .diff-line {
      padding: 0 0.75rem;
    }

    .diff-line.added {
      background-color: var(--diff-add-bg);
      color: var(--diff-add-text);
    }

    .diff-line.removed {
      background-color: var(--diff-remove-bg);
      color: var(--diff-remove-text);
    }

    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      display: none;
    }

    .status-msg.error {
      background-color: rgba(218, 54, 51, 0.2);
      border: 1px solid var(--accent-red);
      color: #ff7b72;
    }

    .status-msg.success {
      background-color: rgba(35, 134, 54, 0.2);
      border: 1px solid var(--accent-green);
      color: #7ee787;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>FixCode Dashboard</h1>
        <div class="repo-info">
          Repository: <span id="repo-display"></span> | Branch: <span id="branch-display"></span>
        </div>
      </div>
      
      <div class="pat-container">
        <input type="password" id="pat-input" placeholder="Enter Personal Access Token (PAT)..." size="30" />
        <button class="btn btn-primary" onclick="loadRepositoryContent()">Load Repository</button>
      </div>
    </header>

    <div id="status-box" class="status-msg"></div>

    <main>
      <div id="code-list" class="code-list">
        <!-- Code cards render here dynamically -->
      </div>
    </main>
  </div>

  <script>
    // GitHub Repository Configuration (Saved in Source Code)
    const GITHUB_CONFIG = {
      username: "sycrip",
      repo: "fixcode",
      branch: "main"
    };

    // Original content storage for computing diffs
    const originalContentMap = {};

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("repo-display").textContent = `${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}`;
      document.getElementById("branch-display").textContent = GITHUB_CONFIG.branch;
      
      // Default initial view with placeholder files
      renderCodeList([
        { path: "src/index.js", sha: "mock1", content: '// Welcome to FixCode\nconsole.log("Hello, World!");' },
        { path: "src/utils.js", sha: "mock2", content: 'function calculateTotal(items) {\n  return items.reduce((a, b) => a + b, 0);\n}' }
      ]);
    });

    function getPAT() {
      return document.getElementById("pat-input").value.trim();
    }

    function showStatus(message, isError = false) {
      const statusBox = document.getElementById("status-box");
      statusBox.textContent = message;
      statusBox.className = `status-msg ${isError ? 'error' : 'success'}`;
      statusBox.style.display = "block";
      setTimeout(() => { statusBox.style.display = "none"; }, 5000);
    }

    // Fetch repository files via GitHub REST API
    async function loadRepositoryContent() {
      const pat = getPAT();
      if (!pat) {
        showStatus("Please enter your Personal Access Token (PAT) first.", true);
        return;
      }

      const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents?ref=${GITHUB_CONFIG.branch}`;

      try {
        const response = await fetch(url, {
          headers: {
            "Authorization": `token ${pat}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (!response.ok) throw new Error(`GitHub API Error: ${response.statusText}`);

        const data = await response.json();
        const fileItems = [];

        for (const item of data) {
          if (item.type === "file") {
            const fileRes = await fetch(item.url, {
              headers: { "Authorization": `token ${pat}` }
            });
            const fileData = await fileRes.json();
            
            // Handle UTF-8 decoding properly
            const decodedContent = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
            
            fileItems.push({
              path: item.path,
              sha: item.sha,
              content: decodedContent
            });
          }
        }

        renderCodeList(fileItems);
        showStatus("Repository files loaded successfully.");
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    // Render cards with combined Editor & Reviewer
    function renderCodeList(files) {
      const container = document.getElementById("code-list");
      container.innerHTML = "";

      files.forEach((file, index) => {
        originalContentMap[file.path] = file.content;

        const card = document.createElement("div");
        card.className = "code-card";

        card.innerHTML = `
          <div class="card-header">
            <span class="file-path">${file.path}</span>
            <div class="actions">
              <button class="btn btn-danger" onclick="deleteCode('${file.path}', '${file.sha}')">Delete</button>
              <button class="btn btn-warning" onclick="toggleWorkspace('${index}')">Edit</button>
              <button class="btn btn-primary" onclick="toggleWorkspace('${index}', true)">Review Change</button>
            </div>
          </div>
          
          <pre class="code-view" id="view-${index}">${escapeHTML(file.content)}</pre>

          <!-- Combined Editor & Reviewer Workspace -->
          <div id="workspace-${index}" class="combined-workspace">
            <div class="workspace-grid">
              <div class="workspace-panel">
                <div class="panel-title">Editor</div>
                <textarea id="editor-${index}" class="code-editor" oninput="updateLiveDiff('${index}', '${file.path}')">${file.content}</textarea>
              </div>
              <div class="workspace-panel">
                <div class="panel-title">Review Changes (Live Diff)</div>
                <div id="diff-view-${index}" class="diff-viewer"></div>
              </div>
            </div>
            <button class="btn btn-success" onclick="saveEdit('${file.path}', '${file.sha}', '${index}')">Save Changes to GitHub</button>
          </div>
        `;

        container.appendChild(card);
        updateLiveDiff(index, file.path);
      });
    }

    // Toggle combined Editor & Reviewer workspace
    function toggleWorkspace(index, focusReview = false) {
      const workspace = document.getElementById(`workspace-${index}`);
      const isVisible = workspace.style.display === "block";

      if (!isVisible) {
        workspace.style.display = "block";
        if (focusReview) {
          document.getElementById(`diff-view-${index}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      } else if (!focusReview) {
        workspace.style.display = "none";
      }
    }

    // Live diff computation between original and edited code
    function updateLiveDiff(index, path) {
      const original = originalContentMap[path] || "";
      const current = document.getElementById(`editor-${index}`).value;
      const diffContainer = document.getElementById(`diff-view-${index}`);

      const origLines = original.split("\n");
      const currLines = current.split("\n");

      let diffHTML = "";
      let hasChanges = false;

      const maxLines = Math.max(origLines.length, currLines.length);
      for (let i = 0; i < maxLines; i++) {
        const origLine = origLines[i];
        const currLine = currLines[i];

        if (origLine === currLine) {
          if (origLine !== undefined) {
            diffHTML += `<div class="diff-line"> ${escapeHTML(origLine)}</div>`;
          }
        } else {
          hasChanges = true;
          if (origLine !== undefined) {
            diffHTML += `<div class="diff-line removed">- ${escapeHTML(origLine)}</div>`;
          }
          if (currLine !== undefined) {
            diffHTML += `<div class="diff-line added">+ ${escapeHTML(currLine)}</div>`;
          }
        }
      }

      if (!hasChanges) {
        diffContainer.innerHTML = '<div class="diff-line" style="color: var(--text-muted); font-style: italic;">No changes made yet. Type in the editor to review differences.</div>';
      } else {
        diffContainer.innerHTML = diffHTML;
      }
    }

    // Button Action 1: Delete File
    async function deleteCode(path, sha) {
      if (!confirm(`Are you sure you want to delete ${path}?`)) return;

      const pat = getPAT();
      if (!pat) {
        showStatus("PAT required to delete file.", true);
        return;
      }

      const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${path}`;

      try {
        const response = await fetch(url, {
          method: "DELETE",
          headers: {
            "Authorization": `token ${pat}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Delete ${path} via FixCode Console`,
            sha: sha,
            branch: GITHUB_CONFIG.branch
          })
        });

        if (!response.ok) throw new Error("Failed to delete file on GitHub.");

        showStatus(`Deleted ${path} successfully.`);
        loadRepositoryContent();
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    // Button Action 2 & 3: Save Edits to GitHub
    async function saveEdit(path, sha, index) {
      const pat = getPAT();
      if (!pat) {
        showStatus("PAT required to save changes.", true);
        return;
      }

      const newContent = document.getElementById(`editor-${index}`).value;
      const url = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${path}`;

      // Handle UTF-8 encoding properly for Base64
      const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

      try {
        const response = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `token ${pat}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Update ${path} via FixCode Console`,
            content: encodedContent,
            sha: sha,
            branch: GITHUB_CONFIG.branch
          })
        });

        if (!response.ok) throw new Error("Failed to update file on GitHub.");

        showStatus(`Saved changes for ${path} successfully.`);
        loadRepositoryContent();
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
