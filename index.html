<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code C++ Code Review Platform</title>
  <style>
    /* VS Code Default Dark+ Core Palette */
    :root {
      --bg-dark: #181818;
      --bg-sidebar: #1f1f1f;
      --bg-card: #252526;
      --bg-editor: #1e1e1e;
      --border-color: #333333;
      --text-main: #cccccc;
      --text-muted: #858585;
      --accent-blue: #007acc;
      --accent-blue-hover: #0062a3;
      
      /* Diff Highlights */
      --diff-del-bg: rgba(248, 81, 73, 0.18);
      --diff-add-bg: rgba(46, 160, 67, 0.22);
      
      /* VS Code C++ Syntax Palette */
      --syn-keyword: #569cd6;
      --syn-control: #c586c0;
      --syn-string: #ce9178;
      --syn-comment: #6a9955;
      --syn-number: #b5cea8;
      --syn-func: #dcdcaa;
      --syn-default: #d4d4d4;

      --badge-done: #238636;
      --badge-pending: #9e6a03;
      --badge-read: #388bfd;
      --btn-danger: #a40e0e;
      --btn-danger-hover: #be1111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; min-height: 100vh; }

    .hidden { display: none !important; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      padding: 32px; border-radius: 6px; width: 100%; max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .modal-card h2 { margin-bottom: 20px; font-size: 1.3rem; text-align: center; color: #ffffff; }

    /* Header */
    header {
      background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
    }
    .user-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.75rem; font-weight: bold; background: var(--accent-blue); color: white;
    }
    .role-select {
      background: var(--bg-editor); color: #ffffff; border: 1px solid var(--border-color);
      padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; outline: none; margin-left: 8px;
    }

    /* Common UI */
    .container { max-width: 1400px; margin: 20px auto; padding: 0 16px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 4px; padding: 20px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
    input[type="text"], input[type="password"], textarea.form-control {
      width: 100%; background: var(--bg-editor); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 8px 12px; border-radius: 4px; font-size: 0.9rem;
    }

    .btn {
      background: var(--accent-blue); color: white; border: none; padding: 8px 16px;
      border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: var(--accent-blue-hover); }
    .btn-secondary { background: #3a3d41; }
    .btn-secondary:hover { background: #45494e; }
    .btn-success { background: #238636; }
    .btn-success:hover { background: #2ea043; }
    .btn-danger { background: var(--btn-danger); }
    .btn-danger:hover { background: var(--btn-danger-hover); }

    /* Badges & File List */
    .status-tag { padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; font-weight: 600; margin-left: 6px; }
    .tag-marked { background: var(--badge-done); color: white; }
    .tag-pending { background: var(--badge-pending); color: white; }
    .tag-read { background: var(--badge-read); color: white; }

    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border-bottom: 1px solid var(--border-color); background: var(--bg-sidebar);
      margin-bottom: 8px; border-radius: 4px;
    }
    .file-tag-pill { background: #333333; color: #9cdcfe; border: 1px solid #454545; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }

    /* Editor Layout */
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .editor-pane { background: var(--bg-editor); border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; }
    .pane-header { background: #252526; padding: 8px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.8rem; font-weight: bold; color: var(--text-muted); letter-spacing: 0.5px; }

    /* Code Display Blocks */
    .code-container {
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 13px; line-height: 19px; padding: 12px;
      min-height: 480px; max-height: 600px; overflow: auto;
      white-space: pre; tab-size: 4; background-color: var(--bg-editor);
      color: var(--syn-default);
    }

    /* Real-Time Syntax Highlighting Editor Wrapper */
    .editor-wrapper {
      position: relative;
      height: 480px;
      background: var(--bg-editor);
    }
    
    .highlight-layer, textarea.code-editor {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 19px;
      padding: 12px;
      tab-size: 4;
      white-space: pre;
      margin: 0;
      border: 0px solid transparent;
      outline: none;
      box-sizing: border-box;
      letter-spacing: 0px;
      word-spacing: 0px;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0;
      -webkit-font-smoothing: antialiased;
    }
    
    .highlight-layer {
      z-index: 1;
      color: var(--syn-default);
      overflow: hidden;
      pointer-events: none;
    }

    textarea.code-editor {
      z-index: 2;
      color: transparent;
      background: transparent;
      caret-color: #d4d4d4;
      resize: none;
      overflow: auto;
    }

    /* Syntax Highlighting CSS Tokens */
    .syn-keyword { color: var(--syn-keyword); font-weight: normal; }
    .syn-control { color: var(--syn-control); font-weight: normal; }
    .syn-string  { color: var(--syn-string); }
    .syn-comment { color: var(--syn-comment); font-style: italic; }
    .syn-number  { color: var(--syn-number); }
    .syn-func    { color: var(--syn-func); }

    /* Diff Highlight Line Rows */
    .diff-row { display: block; width: 100%; min-height: 19px; padding: 0 4px; }
    .diff-del { 
      background-color: var(--diff-del-bg); 
      border-left: 3px solid #f85149; 
      text-decoration: line-through; 
      text-decoration-color: #f85149; 
    }
    .diff-add { 
      background-color: var(--diff-add-bg); 
      border-left: 3px solid #3fb950; 
      text-decoration: underline; 
      text-decoration-color: #3fb950; 
      text-underline-offset: 2px; 
    }
    .diff-equal { border-left: 3px solid transparent; }
  </style>
</head>
<body>

  <!-- GITHUB SETTINGS MODAL -->
  <div id="githubModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>GitHub Repository & PAT Configuration</h2>
      <form id="githubForm">
        <div class="form-group">
          <label>GitHub Owner / Username</label>
          <input type="text" id="ghOwnerInput" placeholder="e.g. your-username" required>
        </div>
        <div class="form-group">
          <label>Repository Name</label>
          <input type="text" id="ghRepoInput" placeholder="e.g. my-code-review-repo" required>
        </div>
        <div class="form-group">
          <label>Branch Name</label>
          <input type="text" id="ghBranchInput" value="main" required>
        </div>
        <div class="form-group">
          <label>Personal Access Token (PAT)</label>
          <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx" required>
          <small style="color: var(--text-muted); font-size: 0.75rem;">Requires <code>contents: write</code> permission.</small>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 16px;">
          <button type="submit" class="btn btn-success" style="flex: 1;">Save Configuration</button>
          <button type="button" class="btn btn-secondary" onclick="closeGitHubModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MAIN APP WORKSPACE -->
  <div id="appContent">
    <header>
      <div style="display: flex; align-items: center; gap: 8px;">
        <strong id="currentUserSpan" style="color: #ffffff;">Unified Workspace</strong>
        <span id="userRoleBadge" class="user-badge">Marker View</span>
        <label style="font-size: 0.85rem; color: var(--text-muted); margin-left: 10px;">Switch User Mode:</label>
        <select id="roleSelector" class="role-select" onchange="switchUserRole(this.value)">
          <option value="Marker">Marker (Edit & Mark Done)</option>
          <option value="Uploader">Viewer / Uploader (Upload & Review Diff)</option>
        </select>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="openGitHubModal()">⚙ GitHub Settings / PAT</button>
      </div>
    </header>

    <main class="container">
      <!-- DASHBOARD / MENU VIEW -->
      <div id="menuView">
        <div id="uploadSection" class="card hidden">
          <h3 style="margin-bottom: 12px; color: #ffffff;">Upload C++ File or Source Code</h3>
          <form id="uploadForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="form-group">
                <label>Code Name / Title</label>
                <input type="text" id="codeNameInput" placeholder="e.g. Solution.cpp" required>
              </div>
              <div class="form-group">
                <label>Tag / Category</label>
                <input type="text" id="codeTagInput" placeholder="e.g. Homework 1" required>
              </div>
            </div>
            
            <div class="form-group">
              <label>Select C++ File OR Input Text Directly</label>
              <input type="file" id="fileInput" accept=".cpp,.h,.hpp,.c,.txt" style="margin-bottom: 8px;">
              <textarea id="rawCodeInput" class="form-control" placeholder="// Paste C++ code here..."></textarea>
            </div>
            <button type="submit" id="uploadBtn" class="btn btn-success">Upload Code to GitHub</button>
          </form>
        </div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="color: #ffffff;">Code Review Files</h3>
            <button class="btn btn-secondary" onclick="syncMenuFromRepo()">↻ Sync from GitHub</button>
          </div>
          <div id="fileListContainer">Loading repository menu...</div>
        </div>
      </div>

      <!-- EDITOR VIEW -->
      <div id="editorView" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <button class="btn btn-secondary" onclick="showMenu()">&larr; Back to Menu</button>
          <div id="editorActions" style="display: flex; gap: 10px;">
            <button id="saveEditsBtn" class="btn btn-success" onclick="saveEdits()">Save Edits to GitHub</button>
            <button id="markDoneBtn" class="btn hidden" style="background: #8957e5;" onclick="markAsDone()">Mark as Done</button>
            <button id="markReadBtn" class="btn btn-secondary hidden" onclick="markAsRead()">Mark as Read</button>
            <button id="deleteActiveFileBtn" class="btn btn-danger hidden" onclick="deleteActiveFile()">Delete File</button>
          </div>
        </div>

        <div class="card" style="padding: 12px 20px; margin-bottom: 12px;">
          <h2 id="activeFileTitle" style="color: #ffffff;">-</h2>
          <span id="activeFileTag" class="file-tag-pill">-</span>
        </div>

        <!-- Side-by-Side View -->
        <div class="editor-grid">
          <!-- Left: Original Code Pane -->
          <div class="editor-pane">
            <div class="pane-header">ORIGINAL CODE</div>
            <div id="leftCodeContainer" class="code-container"></div>
          </div>

          <!-- Right: Editor Pane OR Diff Viewer -->
          <div class="editor-pane">
            <div id="rightPaneHeader" class="pane-header">EDIT CODE</div>
            
            <!-- Real-Time Editor Wrapper (For Markers) -->
            <div id="editorWrapper" class="editor-wrapper hidden">
              <div id="highlightLayer" class="highlight-layer" aria-hidden="true"></div>
              <textarea id="rightCodeEditor" class="code-editor" spellcheck="false"></textarea>
            </div>

            <!-- Diff Viewer (For Viewers/Uploaders) -->
            <div id="rightDiffView" class="code-container hidden"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
  // Unified User Profile Setup
  const USER_MODES = {
    'Marker': { name: 'Marker View', role: 'Marker', canMark: true, canUpload: false, canRead: false },
    'Uploader': { name: 'Viewer / Uploader View', role: 'Viewer/Uploader', canMark: false, canUpload: true, canRead: true }
  };

  let currentUser = USER_MODES['Marker'];
  let activeFileId = null;

  document.addEventListener('DOMContentLoaded', () => {
    switchUserRole('Marker');
    showMenu();
  });

  function switchUserRole(roleKey) {
    currentUser = USER_MODES[roleKey] || USER_MODES['Marker'];
    document.getElementById('currentUserSpan').innerText = currentUser.name;
    document.getElementById('userRoleBadge').innerText = currentUser.role;

    document.getElementById('uploadSection').classList.toggle('hidden', !currentUser.canUpload);
    
    // Refresh active editor state if open
    if (!document.getElementById('editorView').classList.contains('hidden') && activeFileId) {
      openFileEditor(activeFileId);
    } else {
      renderFileList();
    }
  }

  /* --- GITHUB REST API ENGINE --- */
  function getGitHubSettings() {
    const data = localStorage.getItem('gh_config');
    return data ? JSON.parse(data) : { owner: '', repo: '', branch: 'main', token: '' };
  }

  function saveGitHubSettings(config) {
    localStorage.setItem('gh_config', JSON.stringify(config));
  }

  function openGitHubModal() {
    const config = getGitHubSettings();
    document.getElementById('ghOwnerInput').value = config.owner || '';
    document.getElementById('ghRepoInput').value = config.repo || '';
    document.getElementById('ghBranchInput').value = config.branch || 'main';
    document.getElementById('ghTokenInput').value = config.token || '';
    document.getElementById('githubModal').classList.remove('hidden');
  }

  function closeGitHubModal() {
    document.getElementById('githubModal').classList.add('hidden');
  }

  document.getElementById('githubForm').addEventListener('submit', function(e) {
    e.preventDefault();
    saveGitHubSettings({
      owner: document.getElementById('ghOwnerInput').value.trim(),
      repo: document.getElementById('ghRepoInput').value.trim(),
      branch: document.getElementById('ghBranchInput').value.trim() || 'main',
      token: document.getElementById('ghTokenInput').value.trim()
    });
    alert('GitHub & PAT Configuration Saved!');
    closeGitHubModal();
    syncMenuFromRepo();
  });

  async function getGitHubSha(path) {
    const { owner, repo, branch, token } = getGitHubSettings();
    if (!owner || !repo || !token) return null;
    
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
    try {
      const res = await fetch(url, {
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (res.ok) {
        const data = await res.json();
        return data.sha;
      }
    } catch (e) {
      console.error(e);
    }
    return null;
  }

  async function saveFileToGitHub(path, content, commitMessage) {
    const { owner, repo, branch, token } = getGitHubSettings();
    if (!owner || !repo || !token) {
      openGitHubModal();
      throw new Error("GitHub repository settings or token are missing. Please complete setup.");
    }

    const sha = await getGitHubSha(path);
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    
    // Support UTF-8 encoding safely
    const encodedContent = btoa(unescape(encodeURIComponent(content)));

    const body = {
      message: commitMessage,
      content: encodedContent,
      branch: branch
    };
    if (sha) body.sha = sha;

    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'Failed to commit file to GitHub.');
    }
    return await res.json();
  }

  async function deleteFileFromGitHub(path, commitMessage) {
    const { owner, repo, branch, token } = getGitHubSettings();
    if (!owner || !repo || !token) return;

    const sha = await getGitHubSha(path);
    if (!sha) return;

    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    await fetch(url, {
      method: 'DELETE',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        message: commitMessage,
        sha: sha,
        branch: branch
      })
    });
  }

  /* --- CORE UTILITIES --- */
  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function highlightCpp(code) {
    if (!code) return "";
    const tokenRegex = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^\\"])*"|'(?:\\.|[^\\'])*'|<[a-zA-Z0-9_.\/]+>)|(#[a-zA-Z_]\w*)|(\b(?:return|if|else|while|for|do|break|continue|switch|case|default|try|catch|throw)\b)|(\b(?:int|char|float|double|void|bool|long|short|unsigned|signed|auto|const|static|struct|class|enum|typename|template|virtual|override|final|public|private|protected|namespace|using|std|nullptr|true|false)\b)|(\b\d+(?:\.\d+)?\b)|(\b[a-zA-Z_]\w*)(?=\s*\()/g;

    let result = "";
    let lastIndex = 0;
    let match;

    while ((match = tokenRegex.exec(code)) !== null) {
      result += escapeHtml(code.slice(lastIndex, match.index));
      const [fullMatch, comment, str, prep, control, keyword, number, func] = match;

      if (comment) result += `<span class="syn-comment">${escapeHtml(comment)}</span>`;
      else if (str) result += `<span class="syn-string">${escapeHtml(str)}</span>`;
      else if (prep || control) result += `<span class="syn-control">${escapeHtml(prep || control)}</span>`;
      else if (keyword) result += `<span class="syn-keyword">${escapeHtml(keyword)}</span>`;
      else if (number) result += `<span class="syn-number">${escapeHtml(number)}</span>`;
      else if (func) result += `<span class="syn-func">${escapeHtml(func)}</span>`;
      
      lastIndex = tokenRegex.lastIndex;
    }
    result += escapeHtml(code.slice(lastIndex));
    return result;
  }

  /* --- NAVIGATION & FILES --- */
  async function showMenu() {
    document.getElementById('menuView').classList.remove('hidden');
    document.getElementById('editorView').classList.add('hidden');
    await syncMenuFromRepo();
    renderFileList();
  }

  function getStoredFiles() {
    const stored = localStorage.getItem('cpp_project_files');
    return stored ? JSON.parse(stored) : [];
  }

  function saveStoredFilesLocally(files) { 
    localStorage.setItem('cpp_project_files', JSON.stringify(files)); 
  }

  async function saveStoredFilesToGitHub(files, commitMsg) {
    saveStoredFilesLocally(files);
    try {
      await saveFileToGitHub('code/list.json', JSON.stringify(files, null, 2), commitMsg);
    } catch (e) {
      alert(`Local copy saved, but GitHub sync failed: ${e.message}`);
    }
  }

  async function syncMenuFromRepo() {
    const config = getGitHubSettings();
    const path = 'code/list.json';
    let url = path;

    if (config.owner && config.repo) {
      url = `https://raw.githubusercontent.com/${config.owner}/${config.repo}/${config.branch}/${path}?t=${Date.now()}`;
    }

    try {
      const response = await fetch(url);
      if (response.ok) {
        const repoFiles = await response.json();
        saveStoredFilesLocally(repoFiles);
      }
    } catch (err) {
      console.warn("Could not fetch code/list.json from GitHub, using cached files.", err);
    }
    renderFileList();
  }

  /* --- FILE UPLOAD & MANAGEMENT --- */
  document.getElementById('fileInput').addEventListener('change', function(e) {
    if (e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = evt => document.getElementById('rawCodeInput').value = evt.target.result;
      reader.readAsText(e.target.files[0]);
    }
  });

  document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const code = document.getElementById('rawCodeInput').value;
    if (!code) return alert('Please input code.');

    const uploadBtn = document.getElementById('uploadBtn');
    uploadBtn.innerText = "Uploading to GitHub...";
    uploadBtn.disabled = true;

    try {
      const newId = Date.now();
      const origPath = `code/${newId}_original.cpp`;
      const modPath = `code/${newId}_modified.cpp`;
      const name = document.getElementById('codeNameInput').value.trim();
      const tag = document.getElementById('codeTagInput').value.trim();

      await saveFileToGitHub(origPath, code, `Add original code: ${name}`);
      await saveFileToGitHub(modPath, code, `Add modified code: ${name}`);

      const files = getStoredFiles();
      files.push({
        id: newId,
        name: name,
        tag: tag,
        originalPath: origPath,
        modifiedPath: modPath,
        originalCode: code,
        modifiedCode: code,
        isMarked: false, 
        isRead: false
      });

      await saveStoredFilesToGitHub(files, `Update file list for: ${name}`);
      this.reset();
      renderFileList();
      alert('Code successfully committed to GitHub under code/ directory!');
    } catch (err) {
      alert(`Error uploading file: ${err.message}`);
    } finally {
      uploadBtn.innerText = "Upload Code to GitHub";
      uploadBtn.disabled = false;
    }
  });

  async function deleteFile(id, event) {
    if (event) event.stopPropagation();
    if (!confirm("Are you sure you want to delete this file from GitHub?")) return;

    const files = getStoredFiles();
    const file = files.find(f => String(f.id) === String(id));
    if (file) {
      if (file.originalPath) await deleteFileFromGitHub(file.originalPath, `Delete ${file.name} original`);
      if (file.modifiedPath) await deleteFileFromGitHub(file.modifiedPath, `Delete ${file.name} modified`);

      const updated = files.filter(f => String(f.id) !== String(id));
      await saveStoredFilesToGitHub(updated, `Remove file ${file.name}`);
      renderFileList();
    }
  }

  function deleteActiveFile() { if (activeFileId) { deleteFile(activeFileId); showMenu(); } }

  function renderFileList() {
    const files = getStoredFiles();
    const container = document.getElementById('fileListContainer');
    if (!files.length) return container.innerHTML = '<p style="color: var(--text-muted);">No files found in code/ directory. Click Sync or upload a new file.</p>';

    files.sort((a, b) => currentUser.role === 'Marker' 
      ? (a.isMarked === b.isMarked ? 0 : a.isMarked ? 1 : -1) 
      : ((a.isMarked && !a.isRead ? 1 : !a.isMarked ? 2 : 3) - (b.isMarked && !b.isRead ? 1 : !b.isMarked ? 2 : 3))
    );

    container.innerHTML = files.map(f => `
      <div class="file-item">
        <div class="file-meta">
          <strong style="color: #ffffff;">${escapeHtml(f.name)}</strong>
          <span class="file-tag-pill">${escapeHtml(f.tag)}</span>
          ${f.isMarked ? '<span class="status-tag tag-marked">Marked as Done</span>' : '<span class="status-tag tag-pending">Pending</span>'}
          ${f.isRead ? '<span class="status-tag tag-read">Read</span>' : ''}
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" onclick="openFileEditor('${f.id}')">Open & View</button>
          ${currentUser.canUpload ? `<button class="btn btn-danger" onclick="deleteFile('${f.id}', event)">Delete</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  /* --- EDITOR ENGINE & SAVING --- */
  async function openFileEditor(id) {
    const files = getStoredFiles();
    const file = files.find(f => String(f.id) === String(id));
    if (!file) return;

    activeFileId = id;
    document.getElementById('activeFileTitle').innerText = file.name;
    document.getElementById('activeFileTag').innerText = file.tag;

    let origCode = file.originalCode || "";
    let modCode = file.modifiedCode || "";

    if (file.originalPath && file.modifiedPath) {
      const config = getGitHubSettings();
      const getRawUrl = path => (config.owner && config.repo) 
        ? `https://raw.githubusercontent.com/${config.owner}/${config.repo}/${config.branch}/${path}?t=${Date.now()}`
        : path;

      try {
        const [origRes, modRes] = await Promise.all([
          fetch(getRawUrl(file.originalPath)),
          fetch(getRawUrl(file.modifiedPath))
        ]);
        if (origRes.ok) origCode = await origRes.text();
        if (modRes.ok) modCode = await modRes.text();
      } catch (err) {
        console.warn("Could not fetch file content from code/ folder, using cached copy.", err);
      }
    }

    document.getElementById('leftCodeContainer').innerHTML = highlightCpp(origCode);

    const editorWrap = document.getElementById('editorWrapper');
    const diffView = document.getElementById('rightDiffView');
    const header = document.getElementById('rightPaneHeader');

    if (currentUser.canMark) {
      header.innerText = "EDIT CODE";
      editorWrap.classList.remove('hidden');
      diffView.classList.add('hidden');
      
      document.getElementById('rightCodeEditor').value = modCode || origCode;
      syncEditorHighlighting();

      document.getElementById('saveEditsBtn').classList.remove('hidden');
      document.getElementById('markDoneBtn').classList.remove('hidden');
      document.getElementById('markReadBtn').classList.add('hidden');
      document.getElementById('deleteActiveFileBtn').classList.add('hidden');
    } else {
      header.innerText = "CODE COMPARISON RESULT";
      editorWrap.classList.add('hidden');
      diffView.classList.remove('hidden');

      document.getElementById('saveEditsBtn').classList.add('hidden');
      document.getElementById('markDoneBtn').classList.add('hidden');
      document.getElementById('markReadBtn').classList.remove('hidden');
      document.getElementById('deleteActiveFileBtn').classList.remove('hidden');

      renderComparisonResult(origCode, modCode);
    }

    document.getElementById('menuView').classList.add('hidden');
    document.getElementById('editorView').classList.remove('hidden');
  }

  const editorTextarea = document.getElementById('rightCodeEditor');
  const highlightLayer = document.getElementById('highlightLayer');

  function syncEditorHighlighting() {
    const code = editorTextarea.value;
    highlightLayer.innerHTML = highlightCpp(code) + (code.endsWith('\n') ? ' ' : '');
  }

  editorTextarea.addEventListener('input', syncEditorHighlighting);
  
  editorTextarea.addEventListener('scroll', function() {
    highlightLayer.scrollTop = this.scrollTop;
    highlightLayer.scrollLeft = this.scrollLeft;
  });

  editorTextarea.addEventListener('keydown', function(e) {
    const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
    
    if (pairs[e.key]) {
      e.preventDefault();
      const start = this.selectionStart, end = this.selectionEnd, val = this.value;
      this.value = val.substring(0, start) + e.key + pairs[e.key] + val.substring(end);
      this.selectionStart = this.selectionEnd = start + 1;
      syncEditorHighlighting();
      return;
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart, end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 4;
      syncEditorHighlighting();
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      const start = this.selectionStart, val = this.value;
      const currentLine = val.substring(val.lastIndexOf('\n', start - 1) + 1, start);
      const baseIndent = (currentLine.match(/^\s*/) || [''])[0];

      if (val[start - 1] === '{' && val[start] === '}') {
        const innerIndent = baseIndent + '    ';
        this.value = val.substring(0, start) + '\n' + innerIndent + '\n' + baseIndent + val.substring(start);
        this.selectionStart = this.selectionEnd = start + 1 + innerIndent.length;
      } else {
        const indent = baseIndent + (currentLine.trim().endsWith('{') ? '    ' : '');
        this.value = val.substring(0, start) + '\n' + indent + val.substring(start);
        this.selectionStart = this.selectionEnd = start + 1 + indent.length;
      }
      syncEditorHighlighting();
    }
  });

  function computeLineLCS(origText, modText) {
    const origLines = origText.split('\n'), modLines = modText.split('\n');
    const dp = Array.from({ length: origLines.length + 1 }, () => new Int32Array(modLines.length + 1));

    for (let i = 0; i < origLines.length; i++) {
      for (let j = 0; j < modLines.length; j++) {
        dp[i + 1][j + 1] = origLines[i] === modLines[j] ? dp[i][j] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }

    let i = origLines.length, j = modLines.length, diff = [];
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && origLines[i - 1] === modLines[j - 1]) {
        diff.push({ type: 'equal', value: origLines[i - 1] }); i--; j--;
      } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
        diff.push({ type: 'add', value: modLines[j - 1] }); j--;
      } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
        diff.push({ type: 'delete', value: origLines[i - 1] }); i--;
      }
    }
    return diff.reverse();
  }

  function renderComparisonResult(origText, modText) {
    document.getElementById('rightDiffView').innerHTML = computeLineLCS(origText, modText).map(chunk => {
      const hl = highlightCpp(chunk.value) || '&nbsp;';
      return `<div class="diff-row diff-${chunk.type === 'delete' ? 'del' : chunk.type === 'add' ? 'add' : 'equal'}">${hl}</div>`;
    }).join('');
  }

  async function saveEdits() {
    const files = getStoredFiles();
    const file = files.find(f => String(f.id) === String(activeFileId));
    if (!file) return;

    const newCode = document.getElementById('rightCodeEditor').value;
    const saveBtn = document.getElementById('saveEditsBtn');
    saveBtn.innerText = "Saving to GitHub...";
    saveBtn.disabled = true;

    try {
      file.modifiedCode = newCode;
      if (file.modifiedPath) {
        await saveFileToGitHub(file.modifiedPath, newCode, `Update edited code for ${file.name} by ${currentUser.name}`);
      }
      await saveStoredFilesToGitHub(files, `Update metadata for ${file.name}`);
      alert('Edits successfully saved and committed to GitHub!');
    } catch (err) {
      alert(`Save failed: ${err.message}`);
    } finally {
      saveBtn.innerText = "Save Edits to GitHub";
      saveBtn.disabled = false;
    }
  }

  async function markAsDone() {
    const files = getStoredFiles(), file = files.find(f => String(f.id) === String(activeFileId));
    if (file) { 
      file.isMarked = true; 
      await saveStoredFilesToGitHub(files, `Mark ${file.name} as done`);
      alert('File marked as done on GitHub!'); 
      showMenu(); 
    }
  }

  async function markAsRead() {
    const files = getStoredFiles(), file = files.find(f => String(f.id) === String(activeFileId));
    if (file) { 
      file.isRead = true; 
      await saveStoredFilesToGitHub(files, `Mark ${file.name} as read`);
      alert('File marked as read on GitHub!'); 
      showMenu(); 
    }
  }
  </script>
